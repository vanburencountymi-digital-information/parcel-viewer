# DEV ONLY (DIC-1871): proxy /map-buddy-api/ to the local map-buddy container, so the
# viewer on localhost can use AI without Cloud Run. The dev compose mounts this file as
# /etc/nginx/pv/map-buddy-api.conf. Production mounts map-buddy-api.prod.conf instead:
# the local container holds the Anthropic key with no shared quota, so it must never be
# reachable from a deployed host. (Deployed viewers call the Cloud Run URL directly.)
location /map-buddy-api/ {
    # Same per-IP limit as /api/, so even a dev stack can't be hammered through here.
    limit_req zone=pv_api burst=60 nodelay;
    limit_req_status 429;
    set $map_buddy_upstream map-buddy;
    rewrite ^/map-buddy-api/(.*)$ /$1 break;
    proxy_pass http://$map_buddy_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $pv_request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;              # SSE: stream events live
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding off;
    gzip off;                         # SSE: never buffer/compress the stream
}
