# Slim read-only stack for standalone Parcel Viewer deployments.
#
# Usage (recommended — from repo root):
#   cp .env.example .env
#   .\infra\compose.ps1 up --build -d
#
# Or manually from infra/:
#   docker compose -f docker-compose.viewer.yml --env-file ..\.env up --build -d
#
# Open http://localhost:8080/demo/  (PV_HTTP_PORT defaults to 8080)

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      PV_MARTIN_PUBLIC_URL: /tiles
    restart: unless-stopped
    expose:
      - "8000"

  martin:
    image: ghcr.io/maplibre/martin:1.10.1
    platform: linux/amd64
    command: ["--config", "/config/martin.yaml"]
    env_file: ../.env
    volumes:
      - ./martin/martin.yaml:/config/martin.yaml:ro
    restart: unless-stopped
    expose:
      - "3000"

  # Map Buddy AI backend — local copy of the Cloud Run service so the viewer can
  # demo AI map control end-to-end on localhost. Needs ANTHROPIC_API_KEY in .env.
  # nginx proxies /map-buddy-api/ → here (see nginx.viewer.conf); the demo points
  # MapBuddy at that path automatically when served from localhost.
  map-buddy:
    build:
      context: ../map-buddy/backend
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      # Accept either name: the backend wants ANTHROPIC_API_KEY, but the project
      # (and the Cloud Run secret) use PS_ANTHROPIC_API_KEY. Prefer the plain
      # name if set, else fall back to the PS_-prefixed one from .env.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-${PS_ANTHROPIC_API_KEY:-}}"
      ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:8091,http://127.0.0.1:8080"
    # Bind-mount the source + hot-reload so backend edits are live in build mode
    # (mirrors how the frontend is mounted). Remove both lines for prod parity.
    volumes:
      - ../map-buddy/backend:/app:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.viewer.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/public:/usr/share/nginx/html/parcel-viewer:ro
      - ../demo:/usr/share/nginx/html/demo:ro
      - ../map-buddy:/usr/share/nginx/html/map-buddy:ro
    ports:
      - "${PV_HTTP_PORT:-8080}:80"
    depends_on:
      - api
      - martin
      - map-buddy
    restart: unless-stopped
