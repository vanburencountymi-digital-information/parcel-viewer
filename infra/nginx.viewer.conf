server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        return 302 $scheme://$http_host/demo/;
    }

    location /demo/ {
        alias /usr/share/nginx/html/demo/;
        try_files $uri $uri/ /demo/index.html;
    }

    location /frontend/public/ {
        alias /usr/share/nginx/html/parcel-viewer/;
    }

    location /map-buddy/ {
        alias /usr/share/nginx/html/map-buddy/;
    }

    # Map Buddy AI backend (SSE). Buffering off so streamed events flush live.
    location /map-buddy-api/ {
        proxy_pass http://map-buddy:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
}
