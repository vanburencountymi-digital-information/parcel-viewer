# Aerial tile cache (DIC-528). On-disk cache for the proxied Esri World Imagery
# tiles so the cinematic fly/orbit pulls them same-origin in ~1 ms instead of a
# CDN round-trip — and so caching works even when the browser cache is off
# (e.g. DevTools "Disable cache"). proxy_cache_path must live at http context.
proxy_cache_path /var/cache/nginx/aerial levels=1:2 keys_zone=aerial_cache:10m
                 max_size=1g inactive=7d use_temp_path=off;

# API rate limits (DIC-1853), per client IP; zones must live at http context.
# pv_api caps all /api/ traffic. pv_api_heavy additionally caps the expensive,
# scrape-worthy reads — /parcels (up to 10k rows incl. owner names), /cohort, /search
# (leading-wildcard ILIKE) — via a key that is empty (= unlimited) for other URIs.
# Normal use: the bbox hydrate and search are debounced (~3 req/s at most), and the
# bursts absorb a fast pan or a shared office NAT. If a load balancer/CDN ever sits in
# front of nginx, key on the real client IP (set_real_ip_from + real_ip_header) first.
map $uri $pv_api_heavy_key {
    ~^/api/(parcels|cohort|search)$  $binary_remote_addr;
    default                          "";
}
limit_req_zone $binary_remote_addr zone=pv_api:10m       rate=20r/s;
limit_req_zone $pv_api_heavy_key   zone=pv_api_heavy:10m rate=5r/s;

# Request ids + access log (DIC-1879, ADR 0001). Keep the caller's X-Request-ID, else
# use nginx's own; it's passed to the API and Map Buddy (which echo it and put it on
# every log line), so one id ties an nginx line to the app's lines. The log records
# the path without the query string: search terms can be owner names.
map $http_x_request_id $pv_request_id {
    default $http_x_request_id;
    ""      $request_id;
}
log_format pv_main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent rt=$request_time rid=$pv_request_id';
access_log /var/log/nginx/access.log pv_main;

# Content-Security-Policy for the viewer + admin documents (DIC-1855), sent report-only
# (see the server block). One place to edit; a map because add_header can't be reused.
# Inline scripts/styles exist in demo/index.html, hence 'unsafe-inline' for now.
map $host $pv_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (DIC-1855). NOTE: nginx drops ALL server-level add_header lines
    # in any location that sets its own add_header, so locations below that set
    # Cache-Control repeat the ones that matter for them.
    #   - nosniff: every response. Referrer-Policy / X-Frame-Options / CSP: documents.
    #   - X-Frame-Options SAMEORIGIN: the viewer isn't embedded by other sites (it embeds
    #     Street View / JotForm itself, which this header doesn't affect).
    #   - CSP is REPORT-ONLY for the testing window: violations are logged to the browser
    #     console, nothing is blocked. Flip to Content-Security-Policy once clean.
    #   - HSTS belongs with TLS, which terminates wherever prod decides (DIC-1863).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy-Report-Only $pv_csp always;

    # Never serve dotfiles (.env, .git, editor droppings) from any static root.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Compression (DIC-528). The viewer wasn't built with compression; the bbox
    # GeoJSON (~2 MB), MVT tiles, JS and CSS all shipped raw. gzip_proxied so the
    # proxied api/tiles responses are compressed too. MVT = application/x-protobuf.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/x-javascript
        application/json application/geo+json
        image/svg+xml
        application/x-protobuf application/vnd.mapbox-vector-tile;

    location / {
        return 302 $scheme://$http_host/demo/;
    }

    # Dev stack: never cache the viewer's own HTML/JS/CSS. These are bind-mounted live
    # source; browser per-file caching of stale .js has repeatedly masked edits during
    # verification. no-store forces a fresh fetch every load. (Prod fronts assets with a
    # CDN + content-hashed URLs, so this dev-only directive doesn't apply there.)
    location /demo/ {
        alias /usr/share/nginx/html/demo/;
        try_files $uri $uri/ /demo/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only $pv_csp always;
    }

    location /frontend/public/ {
        alias /usr/share/nginx/html/parcel-viewer/;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ISV engine (capability contract + cores + curated corpora). Served so the
    # browser loads the same modules the harness tests (O1-a). Canonical source is
    # parcel-viewer/engine/. .mjs/.json carry correct types via the default mime map.
    location /engine/ {
        alias /usr/share/nginx/html/engine/;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Map Buddy: only the browser assets are public (DIC-1855). Everything else under
    # /map-buddy/ (backend source, deploy.sh, stray local files) is a 404 even if the
    # host copies the whole folder into the web root.
    location /map-buddy/ {
        return 404;
    }
    location /map-buddy/js/ {
        # Same dev-only no-store as the other viewer assets: map-buddy.js is bind-mounted
        # live source and was serving stale across edits (an added command read as "unknown
        # command" from a cached bundle). Prod fronts assets with a CDN + content-hashed URLs.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /map-buddy/css/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Admin Console SPA (config-as-data control plane). Hash-routed, so fall
    # back to its index.html. Reached via the "Staff sign-in / Admin" link in
    # the viewer Settings (DIC-463); it reads/writes config through /api.
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        # no-store like the other viewer assets: a heuristically cached index.html paired
        # with newer JS left the console without scripts added since (DIC-1856).
        # Setting add_header here drops the server-level headers, so repeat them.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only $pv_csp always;
    }

    # Map Buddy AI backend (SSE). Buffering off so streamed events flush live.
    # Map Buddy runs as its own Cloud Run service; the local container is optional.
    # Resolve the upstream lazily via Docker's embedded DNS (127.0.0.11) + a
    # variable so nginx boots even when no map-buddy container is present.
    location /map-buddy-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $map_buddy_upstream map-buddy;
        rewrite ^/map-buddy-api/(.*)$ /$1 break;
        proxy_pass http://$map_buddy_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $pv_request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
        gzip off;                       # SSE: never buffer/compress the stream
    }

    location /api/ {
        limit_req zone=pv_api       burst=60 nodelay;
        limit_req zone=pv_api_heavy burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $pv_request_id;
    }

    # Esri World Imagery aerial, proxied + cached same-origin (DIC-528). The
    # mi-aerial source points at /aerial/{z}/{y}/{x}; nginx fetches from Esri once,
    # caches on disk for 7d, and serves repeats instantly — smoothing the cinematic
    # and surviving browser-cache-off. NOTE (prod): review Esri terms for caching;
    # a licensed key or NAIP may be preferable at scale.
    location /aerial/ {
        proxy_pass https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/;
        proxy_ssl_server_name on;
        proxy_set_header Host services.arcgisonline.com;
        proxy_set_header Accept-Encoding "";
        proxy_cache aerial_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        # Pass Esri's own Cache-Control (max-age=86400) to the browser unchanged —
        # 24h client cache is plenty; nginx's on-disk cache (proxy_cache_valid)
        # holds 7d and serves fast after the browser copy expires.
        add_header X-Aerial-Cache $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        # Cache tiles in the browser (DIC-528). Was "no-store" → every pan/zoom
        # re-fetched every tile. Parcel edits version-bust the URL (?v=<ts> via
        # refreshParcelTiles), so cached tiles are never stale within a session;
        # a moderate max-age bounds cross-session staleness for public viewers.
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
