# Type-checking for the Django API (DIC-2146). Ruff uses the repo-wide config in the root
# pyproject.toml; mypy needs the Django and DRF plugins, so it is configured here and runs
# inside the API container (make typecheck).

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["environ.*", "parameterized.*", "drf_spectacular.*", "knox.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# common/request_context.py is kept identical to the FastAPI copies, which import
# Starlette's types for type-checking only; Starlette isn't installed here.
module = ["starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests get their correctness from running, not from mypy (as in automation-ops-core).
module = "*.tests.*"
ignore_errors = true

[tool.django-stubs]
# The base settings, not the test ones: test.py copies settings in with globals().update
# (no star import, for CodeQL), which the plugin can't see statically.
django_settings_module = "config.settings.base"
