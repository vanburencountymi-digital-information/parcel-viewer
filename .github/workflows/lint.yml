# Lint, format, type and secret checks (DIC-1881): the same pre-commit hooks developers
# run locally (.pre-commit-config.yaml), on every PR. Matches the team boilerplate.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks scans the commits in the push/PR

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Reuses the hook environments (notably mypy's, which installs FastAPI and the
      # rest of additional_dependencies) between runs; rebuilt when the config changes.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      # The commit-msg hook (conventional-pre-commit) only runs at the commit-msg stage,
      # so it's skipped here automatically.
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
