# ISV eval/test harness (A2 / DIC-576).
# Deterministic capability-core tests, the contract/engine smoke, manifest schema
# validation, the facts-parity check, and the Python explainer narration contract.
# No live model is ever called; no secrets are required.
#
# Runs on EVERY pull request and every push to main, with no path filters: it takes
# ~10s, and a required status check that only runs for some paths leaves other PRs
# stuck waiting for it forever. Pushes to other branches are covered by their PR run
# (so a PR doesn't get two identical runs).
name: ISV harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      # Action majors pinned to their Node24-native releases — the older v4/v5 runtimes
      # target the deprecated Node 20 and get force-migrated to Node 24 by the runner,
      # which has been destabilizing this job (see commit 982266d). Node/Python test
      # toolchains bumped to current LTS (tests verified green on Node 20/22/24).
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: JS — capability cores + contract + facts-parity + schema (node --test)
        working-directory: engine
        run: node --test

      - name: Python — run_explain structured-output contract (stdlib unittest, no SDK)
        working-directory: engine
        run: |
          python -VV
          # Run the file directly: `python -m unittest test.<mod>` resolves `test` to
          # the stdlib package, not engine/test/, and fails with ModuleNotFoundError.
          python test/run_explain_contract_test.py
