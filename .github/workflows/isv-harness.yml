# ISV eval/test harness (A2 / DIC-576).
# Deterministic capability-core tests, the contract/engine smoke, manifest schema
# validation, the facts-parity check, and the Python explainer narration contract.
# No live model is ever called; no secrets are required.
#
# Runs on EVERY pull request and every push to main, with no path filters: it takes
# ~10s, and a required status check that only runs for some paths leaves other PRs
# stuck waiting for it forever. Pushes to other branches are covered by their PR run
# (so a PR doesn't get two identical runs).
name: ISV harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the code.
permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      # Action majors pinned to their Node24-native releases — the older v4/v5 runtimes
      # target the deprecated Node 20 and get force-migrated to Node 24 by the runner,
      # which has been destabilizing this job (see commit 982266d). Node/Python test
      # toolchains bumped to current LTS (tests verified green on Node 20/22/24).
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: JS — capability cores + contract + facts-parity + schema (node --test)
        working-directory: engine
        # --experimental-vm-modules: the render tests run converted viewer files as ES
        # modules in a vm sandbox (DIC-2180; engine/test/helpers/sandbox.js). Same as npm test.
        run: node --experimental-vm-modules --test

      - name: Python — explainer contract, cohort SQL, quota, cache, citations, KB, workflow params (stdlib only)
        working-directory: engine
        run: |
          python -VV
          # Run each file directly: `python -m unittest test.<mod>` resolves `test` to
          # the stdlib package, not engine/test/, and fails with ModuleNotFoundError.
          # All of these are stdlib-only (no SDK, no DB). Not listed: run_parcel_store,
          # run_knowledge_store and run_tenant_isolation import the ZIP backend from a
          # sibling repo (../ZIP/zip-poc/backend) that isn't checked out here.
          set -e
          for t in run_explain_contract run_cohort_query run_quota run_cost_cache run_citation_extract run_kb_resolver run_workflow_params; do
            echo "::group::$t"
            python "test/${t}_test.py"
            echo "::endgroup::"
          done

  # Map Buddy's FastAPI endpoint + observability tests (DIC-1879, DIC-1874). The parcel
  # API's tests are in the django-api job below (the FastAPI parcel API is retired).
  # Uses TestClient: no database, no model, no secrets.
  server-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [map-buddy/backend]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Install
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: pytest
        working-directory: ${{ matrix.service }}
        run: pytest -q

  # The parcel API (GeoDjango, DIC-2146): lint, types, missing migrations and tests,
  # against a throwaway PostGIS (tests never reach the shared database).
  django-api:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: parcel_viewer_api
          POSTGRES_USER: api
          POSTGRES_PASSWORD: api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api -d parcel_viewer_api"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      # mypy's Django plugin loads the base settings, which need a key.
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgis://api:api@localhost:5432/parcel_viewer_api
      PV_DATABASE_URL: postgis://api:api@localhost:5432/parcel_viewer_api
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      # GeoDjango loads GEOS, GDAL and PROJ through ctypes.
      - name: Install GeoDjango libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: ruff
        run: ruff check . && ruff format --check .

      - name: mypy
        run: mypy .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      # Logging, request ids and error reporting are one implementation shared with Map
      # Buddy (ADR 0001): the copies must not drift.
      - name: Shared common modules match Map Buddy's
        run: |
          for f in error_logging_client.py logging_setup.py request_context.py; do
            cmp "common/$f" "../map-buddy/backend/common/$f"
          done

      - name: Tests
        run: python manage.py test --noinput

  # The images must build on every PR, so a broken Dockerfile or dependency can't
  # merge (Production App Checklist: "build must succeed"). Nothing is pushed.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: map-buddy
            context: map-buddy/backend
          - name: django-api
            context: api
            target: production
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.name }} image
        env:
          TARGET: ${{ matrix.target }}
        run: docker build ${TARGET:+--target "$TARGET"} --tag "parcel-viewer-${{ matrix.name }}:ci" "${{ matrix.context }}"

  # The web image (DIC-2180): Vite builds the pages, the image serves them, and its nginx
  # config (with the image's own production defaults) passes nginx -t. The e2e suite runs
  # against this image on the fixture database in e2e.yml (DIC-2553).
  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Vite build (pages, hashed CSS, classic-script bundles, Vue islands)
        run: |
          npm ci --no-audit --no-fund
          npm run test:build
          npm test                                  # Vue components (Vitest, DIC-2389)
          npm run build
          # The Vue islands' entry is a module bundle of Vite's own (DIC-2389).
          grep -qE '<script type="module"[^>]* src="/assets/demo-[^"]*\.js"' dist/demo/index.html
          test -f dist/demo/index.html && test -f dist/admin/index.html
          grep -q '/assets/demo-.*\.css' dist/demo/index.html
          grep -q '/assets/scripts-.*\.js' dist/demo/index.html
          ! grep -q '/frontend/public/js/map.js' dist/demo/index.html   # bundled (slice 2b)
          # CSP script-src 'self' (DIC-2556): the built pages have no inline script either.
          ! grep -P '<script(?![^>]*\ssrc=)[^>]*>' dist/demo/index.html dist/admin/index.html
          # The baked county config stays its own tag, just before the served one.
          grep -A1 '/frontend/public/js/county-config.js' dist/demo/index.html | grep -q '/api/config.js'
          # No code from a CDN: MapLibre, Turf and proj4 are bundled from npm (slice 4).
          ! grep -qE '(src|href)="https://(unpkg|cdn\.jsdelivr|cdnjs)' dist/demo/index.html dist/admin/index.html

      - name: Build the web image
        run: docker build -f infra/web.Dockerfile --tag parcel-viewer-web:ci .

      - name: nginx -t inside the image
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 --add-host martin:127.0.0.1 --add-host map-buddy:127.0.0.1 \
            --add-host django-api:127.0.0.1 \
            parcel-viewer-web:ci nginx -t

      - name: Cloud Run settings (PORT, proxy hops, aerial cache; ADR 0018)
        run: bash infra/test-web-image-cloud-run.sh parcel-viewer-web:ci

  # The nginx config and the compose files must be valid, and production must never
  # get the dev Map Buddy proxy (DIC-1871, DIC-1874). No containers are started.
  infra-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: nginx -t with the dev and the prod snippet, and each API upstream
        run: |
          for combo in dev:django prod:django; do
            variant=${combo%%:*}; upstream=${combo##*:}
            echo "::group::nginx -t ($variant, $upstream)"
            docker run --rm \
              --add-host django-api:127.0.0.1 \
              --add-host martin:127.0.0.1 --add-host map-buddy:127.0.0.1 \
              -v "$PWD/infra/nginx.viewer.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$PWD/infra/nginx/map-buddy-api.$variant.conf:/etc/nginx/pv/map-buddy-api.conf:ro" \
              -v "$PWD/infra/nginx/api-upstream.$upstream.conf:/etc/nginx/pv/api-upstream.conf:ro" \
              nginx:1.27-alpine nginx -t
            echo "::endgroup::"
          done

      - name: Compose files are valid; production runs Django and no local Map Buddy
        env:
          # Placeholders for the settings docker-compose.prod.yml requires (it refuses to
          # start without them); only for validating the file.
          DJANGO_SECRET_KEY: ci-placeholder
          DJANGO_DB_PASSWORD: ci-placeholder
          PV_PUBLIC_HOST: example.org
        run: |
          docker compose -f infra/docker-compose.viewer.yml config --quiet
          docker compose -f infra/docker-compose.viewer.yml -f infra/docker-compose.web-image.yml config --quiet
          docker compose -f infra/docker-compose.viewer.yml -f infra/docker-compose.web-image.yml -f infra/docker-compose.e2e.yml config --quiet
          docker compose -f infra/docker-compose.prod.yml config --quiet
          services=$(docker compose -f infra/docker-compose.prod.yml config --services)
          echo "production services: $services"
          if echo "$services" | grep -qx map-buddy; then
            echo "::error::docker-compose.prod.yml must not run a local map-buddy (DIC-1871)"; exit 1
          fi
          if grep -q "map-buddy-api.dev.conf" infra/docker-compose.prod.yml; then
            echo "::error::docker-compose.prod.yml mounts the dev /map-buddy-api/ proxy (DIC-1871)"; exit 1
          fi
          # Django is the deployed backend (DIC-2150): nginx must send /api/ to it, and the
          # FastAPI service must not come back into production.
          if ! echo "$services" | grep -qx django-api || echo "$services" | grep -qx api; then
            echo "::error::docker-compose.prod.yml must run django-api, not the FastAPI api (DIC-2150)"; exit 1
          fi
          if ! grep -q "api-upstream.django.conf" infra/docker-compose.prod.yml; then
            echo "::error::docker-compose.prod.yml must point /api/ at Django (api-upstream.django.conf; DIC-2150)"; exit 1
          fi
          # Without the required settings, compose must refuse to start (not run with blanks).
          if env -u DJANGO_SECRET_KEY docker compose -f infra/docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo "::error::docker-compose.prod.yml started without DJANGO_SECRET_KEY"; exit 1
          fi
