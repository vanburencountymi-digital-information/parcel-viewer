# CodeQL scope (DIC-1880). Scans the code that ships; skips copies and tests.
name: parcel-viewer CodeQL config

# security-and-quality: the default security queries plus reliability checks.
queries:
  - uses: security-and-quality

paths-ignore:
  # Generated copies of engine/drawing/ (node engine/drawing/generate.mjs). The masters
  # are scanned; scanning both would report every finding twice.
  - frontend/public/js/drawing
  # Test code: not deployed, and full of deliberately hostile inputs.
  - e2e
  - engine/test
  - '**/tests'
