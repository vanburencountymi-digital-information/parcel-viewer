<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parcel Viewer — Admin Console</title>
  <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible/400.css">
  <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible/700.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <!-- Must run before every other script: see the file header (DIC-1873). -->
  <!-- First: reports JS errors (incl. startup) to /api/client-errors (DIC-1879). -->
  <script src="/frontend/public/js/pv-error-beacon.js"></script>
  <script src="/frontend/public/js/pv-storage-guard.js"></script>
</head>
<body>
  <div id="ac-app" class="ac-app">
    <!-- Sidebar -->
    <aside class="ac-side" role="navigation" aria-label="Admin sections">
      <div class="ac-brand">
        <span class="ac-brand-mark">◆</span>
        <span class="ac-brand-text">Parcel Viewer<small>Admin Console</small></span>
      </div>
      <nav id="ac-nav" class="ac-nav"></nav>
      <!-- Staff sign-in (DIC-2151): a Vue island (frontend/src/admin-console, DIC-2389). -->
      <div id="ac-auth" class="ac-side-foot ac-auth" data-testid="ac-auth"></div>
    </aside>

    <!-- Main -->
    <div class="ac-main">
      <header class="ac-topbar">
        <div class="ac-county">
          <label for="ac-county-select" class="ac-county-label">County</label>
          <select id="ac-county-select" class="ac-county-select" aria-label="Active county">
            <option>Van Buren County</option>
          </select>
        </div>
        <div class="ac-top-actions">
          <span id="ac-status" class="ac-pill" role="status" aria-label="Config status">Read-only preview</span>
        </div>
      </header>
      <main id="ac-content" class="ac-content" tabindex="-1"></main>
    </div>
  </div>

  <!-- The live county manifest (current source of truth). The console reads it
       today; a runtime /config API (DIC-465) replaces this bake later. -->
  <script src="/frontend/public/js/county-config.js"></script>
  <script src="/frontend/public/js/pv-endpoints.js"></script>
  <!-- ISV engine (C2 + B2, ES modules since DIC-2180): the Theme Manifest module assembles
       the editor slices into one §5 manifest and validates it through the SAME
       loadManifest() gate CI uses; plus the B3 theme-composer core (DIC-579). The entry
       puts the console's window.ISV_* hooks on window; the build bundles it in place. -->
  <script src="/engine/browser-admin.js"></script>
  <script src="/admin/js/admin.js"></script>
  <!-- The console's Vue islands (DIC-2389, ADR 0017), starting with the staff sign-in. A
       module runs after the page is parsed, so after the classic scripts above but before
       admin.js's init (DOMContentLoaded): its PV_ADMIN_AUTH hook is there for the first render. -->
  <script type="module" src="/frontend/src/admin-main.js"></script>
</body>
</html>
