<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parcel Viewer — Admin Console</title>
  <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible/400.css">
  <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible/700.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <!-- Must run before every other script: see the file header (DIC-1873). -->
  <!-- First: reports JS errors (incl. startup) to /api/client-errors (DIC-1879). -->
  <script src="/frontend/public/js/pv-error-beacon.js"></script>
  <script src="/frontend/public/js/pv-storage-guard.js"></script>
</head>
<body>
  <!-- The console's shell (sidebar nav, staff sign-in, top bar, content area) is a Vue
       island (frontend/src/admin-console, DIC-2389); the modules inside it are admin.js's. -->
  <div id="ac-app" class="ac-app"></div>

  <!-- The live county manifest (current source of truth). The console reads it
       today; a runtime /config API (DIC-465) replaces this bake later. -->
  <script src="/frontend/public/js/county-config.js"></script>
  <script src="/frontend/public/js/pv-endpoints.js"></script>
  <!-- ISV engine (C2 + B2, ES modules since DIC-2180): the Theme Manifest module assembles
       the editor slices into one §5 manifest and validates it through the SAME
       loadManifest() gate CI uses; plus the B3 theme-composer core (DIC-579). The entry
       puts the console's window.ISV_* hooks on window; the build bundles it in place. -->
  <script src="/engine/browser-admin.js"></script>
  <script src="/admin/js/admin.js"></script>
  <!-- The console's Vue islands (DIC-2389, ADR 0017). A module runs after the page is
       parsed, so after the classic scripts above: admin.js has registered its modules. -->
  <script type="module" src="/frontend/src/admin-main.js"></script>
</body>
</html>
